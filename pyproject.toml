[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flatJSON2csv"
version = "0.1.0"
description = "ted thought this was functional & fancy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ijson>=3.2,<4"]

[project.scripts]
flatJSON2csv = "flatJSON2csv:main"

[tool.setuptools]
py-modules = ["flatJSON2csv", "converter"]
