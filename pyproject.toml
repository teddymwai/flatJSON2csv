[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flatJSON2csv"
version = "2.0.0"
description = "Unnest Studio — The local, privacy-first JSON to tabular studio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ijson>=3.2,<4"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.0"]

[project.scripts]
unnest = "flatJSON2csv:main"
flatJSON2csv = "flatJSON2csv:main"

[tool.setuptools]
py-modules = ["flatJSON2csv", "converter"]
